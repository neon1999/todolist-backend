name: Keep Render backend awake

on:
  schedule:
    # GitHub Actions cron uses UTC. IST is UTC+05:30.
    # Runs every 10 minutes from 13:00 IST through 01:00 IST.
    - cron: "30-59/10 7 * * *"
    - cron: "*/10 8-18 * * *"
    - cron: "0-30/10 19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -eu
          test -n "$RENDER_BACKEND_URL"
          curl --fail --silent --show-error --max-time 30 \
            "$RENDER_BACKEND_URL/api/health"
