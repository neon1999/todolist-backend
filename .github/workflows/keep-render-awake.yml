name: Keep Render backend awake

on:
  schedule:
    # Runs every 10 minutes from 07:30 UTC to 19:30 UTC 
    # (Matches 13:00 IST to 01:00 IST)
    - cron: "30,40,50 7 * * *"
    - cron: "*/10 8-18 * * *"
    - cron: "0,10,20,30 19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -eu
          test -n "$RENDER_BACKEND_URL"
          curl --fail --silent --show-error --max-time 30 \
            "$RENDER_BACKEND_URL/api/health"
