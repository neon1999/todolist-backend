name: Keep Render backend awake

on:
  schedule:
    # GitHub Actions uses UTC. Keep this split across midnight UTC:
    # 07:30-07:50 UTC, every 10 minutes from 08:00-18:50 UTC,
    # and 19:00-19:30 UTC (13:00-01:00 IST).
    - cron: "30,40,50 7 * * *"
    - cron: "*/10 8-18 * * *"
    - cron: "0,10,20,30 19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -eu
          test -n "$RENDER_BACKEND_URL"
          curl --fail --silent --show-error --max-time 30 \
            "$RENDER_BACKEND_URL/api/health"
