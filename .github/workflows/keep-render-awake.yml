name: Keep Render backend awake

on:
  schedule:
    # GitHub Actions cron uses UTC. Trigger every 10 minutes, then apply
    # the 13:00-01:00 IST ping window in the job below.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -eu
          test -n "$RENDER_BACKEND_URL"
          hour=$(TZ=Asia/Kolkata date +%H)
          if [ "$hour" -lt 13 ] && [ "$hour" -ge 1 ]; then
            echo "Outside the 13:00-01:00 IST ping window."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$RENDER_BACKEND_URL/api/health"
